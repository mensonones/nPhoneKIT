# Ruff configuration for nPhoneKIT.
#
# The lint gate covers the application entrypoint and the unit-tested core.
# The vendored deps/mtkclient tree is never linted here.
#

target-version = "py310"
line-length = 100
extend-exclude = ["deps"]

[lint]
# Conservative, high-signal rule set: real errors and likely bugs
# (pyflakes + syntax/logic-level pycodestyle), no cosmetic style nitpicking yet.
#   E4  - import errors
#   E7  - statement errors
#   E9  - syntax errors
#   F   - pyflakes (undefined names, unused imports/variables, ...)
#   W   - pycodestyle warnings
select = ["E4", "E7", "E9", "F", "W"]
