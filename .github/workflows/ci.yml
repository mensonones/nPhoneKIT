name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile main.py (syntax check)
        # Cheap guard: fails the build on any syntax error in the app entrypoint,
        # even though main.py can't be fully imported in CI (it opens serial
        # ports / starts threads at import time).
        run: python -m py_compile main.py

      - name: Run tests
        run: python -m pytest
